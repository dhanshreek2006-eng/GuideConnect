{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h1 class="fw-bold mb-2">
                        Program Enrollment
                    </h1>

                    <p class="text-muted mb-4">
                        Fill in your details to enroll in the program.
                    </p>


                    {% if success %}

                    <div class="alert alert-success">
                        Enrollment successful!
                        Your application has been submitted.
                    </div>

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Phone -->
                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Program -->
                        <div class="mb-3">

                            <label class="form-label">
                                Select Program
                            </label>

                            <select name="program"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select a program
                                </option>

                                <option value="Python & Django Development">
                                    Python & Django Development
                                </option>

                                <option value="Data Science">
                                    Data Science
                                </option>

                                <option value="Machine Learning">
                                    Machine Learning
                                </option>

                                <option value="Web Development">
                                    Web Development
                                </option>

                                <option value="Cloud & DevOps">
                                    Cloud & DevOps
                                </option>

                                <option value="UI/UX Design">
                                    UI/UX Design
                                </option>

                            </select>

                        </div>


                        <!-- Submit -->
                        <div class="d-grid mt-4">

                            <button type="submit"
                                    class="btn btn-primary">
                                Submit Enrollment
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
